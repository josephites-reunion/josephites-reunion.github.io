<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B1622">
<title>Josephites-Reunion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B1622;--ink2:#16263A;--mist:#9FB3C8;--bg:#EEF1F4;--card:#FFFFFF;--line:#E1E5EA;--line2:#D7DCE3;--text:#111827;--sub:#5B6472;--teal:#0E5E6F;--teal2:#0A4652;--tealbg:#E6F1F3;
--g:#1E9E5E;--gbg:#DCF2E6;--gfg:#0F6B3E;--a:#D99A1C;--abg:#FBEFD3;--afg:#7A5200;--r:#D64545;--rbg:#FBE1E1;--rfg:#9B2C2C;--n:#9AA3AF;--nbg:#E7EAEF;--nfg:#3F4754;--warnbg:#FFF6E5;--warnline:#F1D49A;--warnfg:#4A3500;
--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--disp:Sora,'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #3DB7C9;outline-offset:2px}
.mono{font-family:var(--mono)}
.hdr{background:var(--ink);color:#F3F5F7;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0 16px}
.hdr-in{max-width:1200px;margin:0 auto}
.hdr-top{display:flex;align-items:center;gap:12px;min-height:44px}
.brand{font-family:var(--disp);font-weight:700;font-size:20px;flex-grow:1;white-space:nowrap}
@media (max-width:400px){.brand{font-size:17px}.who{font-size:11px}}
@media (max-width:520px){.hdr-top{flex-wrap:wrap;row-gap:4px}.who{order:3;flex-basis:100%;text-align:left;display:flex;flex-wrap:wrap;gap:0 6px;align-items:baseline;font-size:12px;padding-bottom:2px}.who>div+div::before{content:'\00B7  ';}}
.who{font-size:12px;color:var(--mist);text-align:right;line-height:1.3}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--ink2);color:#F3F5F7;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;height:44px;padding:0 14px;border:0;border-radius:10px 10px 0 0;background:transparent;color:var(--mist);font-weight:600;font-size:14px}
.tab.on{background:var(--bg);color:var(--ink)}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.narrow{max-width:760px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(11,22,34,.06)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.h2{font-family:var(--disp);font-weight:700;font-size:18px;margin:0}
.lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
.muted{color:var(--sub);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stat .n{font-family:var(--mono);font-size:22px;font-weight:600}
.stat .t{font-size:11px;color:#4B5563}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#E5E7EB}
.bar>span{display:block;height:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex-shrink:0;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:#fff;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:0 12px;height:44px}
.search input{border:0;outline:none;flex-grow:1;background:transparent;font-size:15px;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:64px}
.av{width:40px;height:40px;border-radius:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.grow{flex-grow:1;min-width:0}
.nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--sub)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;white-space:nowrap}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.small{min-height:34px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--rfg);border-color:#E9B4B4}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#374151}
.field input,.field select,.field textarea{min-height:44px;border:1px solid var(--line2);border-radius:10px;padding:8px 12px;background:#fff;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sbtn{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 12px;border:0;border-radius:12px;background:#fff;text-align:left;box-shadow:inset 0 0 0 1px var(--line2)}
.dot{width:12px;height:12px;border-radius:6px;flex-shrink:0;display:inline-block}
.overlay{position:fixed;inset:0;background:rgba(11,22,34,.5);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;z-index:20;padding-bottom:var(--kb,0px);overscroll-behavior:contain}
.sheet{background:#fff;width:100%;max-width:600px;max-height:94vh;max-height:calc(100dvh - var(--kb,0px) - 16px);border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.sheet.noanim{animation:none!important}
.sheet-body{overscroll-behavior:contain}
body.locked{overflow:hidden}
.sheet-body{overflow-y:auto;padding:12px 20px 20px 20px;display:flex;flex-direction:column;gap:20px}
.sheet-foot{display:flex;gap:10px;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px)) 20px;border-top:1px solid #E5E7EB}
@media (min-width:700px){.overlay{justify-content:center}.sheet{border-radius:20px;max-height:90vh}}
.grab{width:40px;height:4px;border-radius:2px;background:#D1D5DB;align-self:center}
.hist{display:flex;gap:10px;font-size:13px;padding:8px 0;border-top:1px solid #F0F2F5}
.hist:first-child{border-top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#F3F5F7;border-radius:12px;padding:12px 16px;font-size:14px;z-index:40;max-width:92vw;box-shadow:0 8px 24px rgba(11,22,34,.3)}
.toast.err{background:#7F1D1D}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 4px 16px rgba(11,22,34,.06)}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:600;margin-top:4px}
.alert{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--warnbg);border:1px solid var(--warnline);border-radius:14px;padding:12px 16px;color:var(--warnfg)}
.ztable{display:flex;flex-direction:column}
.zrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:12px 4px;border-top:1px solid #EEF0F3;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.zrow:hover{background:#F7F9FB}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);padding:8px;border-bottom:1px solid #E5E7EB;white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid #EEF0F3;vertical-align:middle}
.scrollx{overflow-x:auto}
.gcard{background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 14px rgba(11,22,34,.06)}
.mchip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line2);background:#F7F8FA;font-size:13px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--ink)}
.login{background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.copybox{white-space:pre-wrap;background:#F4F6F8;border:1px dashed var(--line2);border-radius:10px;padding:12px;font-size:13px;font-family:var(--mono)}
.vbar{display:flex;align-items:center;gap:12px}
.vbar .tr{flex-grow:1;height:22px;border-radius:6px;background:#EEF0F3;overflow:hidden}
.vbar .tr>span{display:block;height:100%;background:var(--teal)}
.empty{text-align:center;color:var(--sub);padding:28px 8px;font-size:14px}
.zhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:14px 2px 0;padding-bottom:6px;border-bottom:2px solid var(--line2);font-weight:700;font-size:16px;color:var(--text)}.zhead:first-child{margin-top:0}.zhead .muted{font-weight:500;font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:420px){.stats .n{font-size:20px}}
.bnav{display:none}
.icard{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:#fff}
.linkbtn{border:0;background:transparent;padding:0;color:var(--teal);font-weight:600;font-size:15px;text-align:left;min-height:32px}
.dl{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:699px){
  .tabs{display:none}
  .hdr{padding-bottom:12px}
  body.has-nav{padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(11,22,34,.06)}
  .bnav button{flex:1 1 0;min-width:0;min-height:54px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--sub);border-radius:12px;padding:0 2px}
  .bnav button.on{color:var(--teal);background:var(--tealbg)}
  .bnav span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .wrap{padding:12px}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .kpi{padding:10px 12px;border-radius:12px}
  .kpi .v{font-size:18px}
  .dl .btn{flex:1 1 0}
  .h2{font-size:17px}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

/* ---------------- data ---------------- */
async function loadAll(){
  var uid=(await sb.auth.getUser()).data.user.id;
  var me=await sb.from('app_users').select('*').eq('user_id',uid).maybeSingle();
  if(me.error)throw me.error;
  if(!me.data){S.view='norole';render();return;}
  S.me=me.data;
  var r=await Promise.all([
    sb.from('settings').select('*').eq('id',1).maybeSingle(),
    sb.from('zones').select('*').order('sort'),
    sb.from('person_summary').select('*').order('name'),
    sb.from('app_users').select('user_id,username,role,zone_id,person_id,must_change_password,created_at,title')
  ]);
  for(var i=0;i<r.length;i++)if(r[i].error)throw r[i].error;
  S.settings=r[0].data||{amount_due:3000,date_options:[],venue_options:[]};
  S.zones=r[1].data||[];S.people=r[2].data||[];S.logins=r[3].data||[];
  var mp=personById(S.me.person_id);S.meName=mp?mp.name:S.me.username;
  if(isAdmin()){await loadMoney();await loadSecrets();}
  if(!S.tab)S.tab=isAdmin()?'dashboard':'members';
  if(S.me.role==='zone_leader')S.zone=S.me.zone_id;
  S.view='app';render();
}
async function loadSecrets(){
  if(!isAdmin()){S.secrets={};return;}
  var r=await sb.from('login_secrets').select('user_id,password,set_at');
  S.secrets={};if(!r.error)(r.data||[]).forEach(function(x){S.secrets[x.user_id]=x;});
}

  catch(e){var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e2){}ta.remove();}
  toast(msg||'Copied');
}
async function loadMoney(){
  var r=await Promise.all([sb.from('payments').select('*').order('created_at',{ascending:false}),sb.from('receipts').select('*').order('created_at',{ascending:false})]);
  if(r[0].error)throw r[0].error;if(r[1].error)throw r[1].error;

}

/* payments helpers: net per original payment, confirmation */
function paymentRows(list,receipts){
  var rev={};list.forEach(function(p){if(p.reverses_payment_id){rev[p.reverses_payment_id]=(rev[p.reverses_payment_id]||0)+(-p.amount);}});
  var rc={};receipts.forEach(function(r){if(!r.voided_at)rc[r.payment_id]=r;});
  return list.filter(function(p){return p.amount>0;}).map(function(p){var net=p.amount-(rev[p.id]||0);return {p:p,net:net,cancelled:net<=0,receipt:rc[p.id]||null};});
}

/* ---------- export ---------- */
function csvCell(v){var s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function download(name,rows){
  var stamp=new Date().toLocaleString('en-IN');
  var txt='\uFEFF'+csvCell('Snapshot as of '+stamp+' — not live')+'\n'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function exportMembers(){
  var rows=[['#','Name','Zone','City','Phone','Zone coordinator','Status','Paid','Confirmed','Month vote','Venue vote','Remark','Last update','Updated by']];
  S.people.slice().sort(function(a,b){return (a.zone_id-b.zone_id)||a.name.localeCompare(b.name);}).forEach(function(p){rows.push([p.sheet_no,p.name,p.zone_name,p.city,p.phone,liveGroup(p)||'',ST[p.status].t,p.paid,p.received,p.date_vote,p.venue_vote,p.remark,p.last_update_at?new Date(p.last_update_at).toLocaleString('en-IN'):'',p.last_update_by]);});
  download('josephites-reunion-members-'+today()+'.csv',rows);
}
function exportPayments(){
  var active={},undone={};S.receipts.forEach(function(r){if(r.voided_at)(undone[r.payment_id]=undone[r.payment_id]||[]).push(r);else active[r.payment_id]=r;});
  var cancelledBy={};S.payments.forEach(function(x){if(x.reverses_payment_id)cancelledBy[x.reverses_payment_id]=x.id;});
  var rows=[['Entry id','Name','Zone','Amount','Status','Entered on','Entered by','Entered at','Cancels entry','Cancelled by entry','Confirmed amount','Confirmed on','Bank ref','Confirmed by','Confirmation undone','Undo reason','Undone by']];
  S.payments.slice().reverse().forEach(function(x){
    var p=personById(x.person_id),r=active[x.id],u=(undone[x.id]||[]).slice(-1)[0];
    var st=x.amount<0?'Cancellation':(cancelledBy[x.id]?'Cancelled':(r?'Confirmed':'Waiting for treasurer'));
    rows.push([x.id,p?p.name:'',p?p.zone_name:'',x.amount,st,x.paid_on,x.created_by_name,new Date(x.created_at).toLocaleString('en-IN'),x.reverses_payment_id||'',cancelledBy[x.id]||'',
      r?r.amount_received:'',r?r.received_on:'',r?r.bank_ref:'',r?r.confirmed_by_name:'',
      u?new Date(u.voided_at).toLocaleString('en-IN'):'',u?u.void_reason:'',u?u.voided_by_name:'']);});
  var net={};S.payments.forEach(function(x){net[x.person_id]=(net[x.person_id]||0)+x.amount;});
  rows.push([]);rows.push(['','Net paid per classmate (entries minus cancellations)']);
  Object.keys(net).forEach(function(k){var p=personById(Number(k));rows.push(['',p?p.name:'',p?p.zone_name:'',net[k]]);});
  download('josephites-reunion-payments-'+today()+'.csv',rows);
}

async function saveStatus(){
  var P=S.panel,d=P.draft;
  var p=personById(P.id);
  var same=p.status===d.status&&(p.date_vote||'')===d.date&&(p.venue_vote||'')===d.venue&&(p.remark||'')===d.remark;
  if(same){S.panel=null;renderLayer();return toast('No changes to save');}
  var r=await sb.from('status_log').insert({person_id:P.id,status:d.status,date_vote:d.date||null,venue_vote:d.venue||null,remark:d.remark||null});
  if(r.error)throw r.error;
  S.panel=null;await refreshPeople();render();toast('Saved · '+p.name);
}
async function addPayment(){
  var amt=Number(String(document.getElementById('pa').value).replace(/[^0-9]/g,''));
  if(!amt||amt<1||amt>100000)return toast('Enter an amount between \u20B91 and \u20B91,00,000.',true);
  var D=S.payDlg,p=personById(D.id);
  var r=await sb.from('payments').insert({person_id:D.id,amount:amt,paid_on:today()});
  if(r.error)throw r.error;
  S.payDlg=null;await refreshPeople();render();await openPanel(D.id,D.draft);toast('Saved '+inr(amt)+' for '+p.name+' · waiting for treasurer');
}
async function savePerson(){
  var f=S.person,name=document.getElementById('fn').value.trim().replace(/\s+/g,' '),zone=Number(document.getElementById('fz').value),city=document.getElementById('fc').value.trim(),phone=document.getElementById('fp').value.trim();
  if(name.length<2)return toast('Enter the classmate\u2019s name.',true);
  var dup=S.people.find(function(p){return p.name.toLowerCase()===name.toLowerCase()&&p.id!==f.id;});
  if(dup&&!window.confirm('There is already a "'+dup.name+'" in '+dup.zone_name+'. Save anyway?'))return;
  if(f.mode==='add'){
    var next=S.people.reduce(function(m,p){return Math.max(m,p.sheet_no||0);},0)+1;
    var r=await sb.from('people').insert({sheet_no:next,name:name,city:city||null,zone_id:zone,phone:phone||null}).select('id').single();
    if(r.error)throw r.error;
    S.person=null;await refreshPeople();render();await openPanel(r.data.id);toast(name+' added to '+zoneName(zone));
  }else{
    var old=personById(f.id),upd={name:name,city:city||null,phone:phone||null};
    if(zone!==old.zone_id){if(!window.confirm('Move '+old.name+' from '+old.zone_name+' to '+zoneName(zone)+'? They leave their current group, and the '+zoneName(zone)+' leaders will see them.'))return;upd.zone_id=zone;}
    var r2=await sb.from('people').update(upd).eq('id',f.id);
    if(r2.error)throw r2.error;
    S.person=null;await refreshPeople();render();await openPanel(f.id,upd.zone_id?null:f.draft);toast('Saved · '+name);
  }
}
async function cancelPayment(payId){
  var x=(S.panel.pays||[]).find(function(r){return r.p.id===payId;});if(!x)return;
  if(!window.confirm('Cancel the '+inr(x.net)+' entry? A cancellation line is added to the history.'))return;
  var r=await sb.from('payments').insert({person_id:x.p.person_id,amount:-x.net,reverses_payment_id:payId,paid_on:today(),note:'Cancelled entry'});
  if(r.error)throw r.error;
  var pid=S.panel.id,kd=S.panel.draft;await refreshPeople();render();await openPanel(pid,kd);toast('Entry cancelled');
}
async function doConfirm(payId){
  var amt=Number(String(document.getElementById('ca').value).replace(/[^0-9]/g,'')),dt=document.getElementById('cd').value||today(),ref=document.getElementById('cr').value.trim();
  if(!amt||amt<1)return toast('Enter the amount you received.',true);

async function undoConfirm(rid){
  var rc=(S.panel.rcs||[]).find(function(r){return r.id===rid;});if(!rc)return;

  if(why.length<3)return toast('Give a short reason, e.g. "Confirmed wrong person".',true);

  if(r.error)throw r.error;
  var pid=S.panel.id,kd=S.panel.draft;await refreshPeople();render();await openPanel(pid,kd);toast('Confirmation undone');

function readNewLogin(){return {zone:(document.getElementById('nlz')||{}).value||'',person:(document.getElementById('nlp')||{}).value||'',role:(document.getElementById('nlr')||{}).value||'group_leader',username:((document.getElementById('nlu')||{}).value||'').trim().toLowerCase(),password:((document.getElementById('nlw')||{}).value||'').trim()};}
async function callFn(body){
  var r=await sb.functions.invoke('manage-logins',{body:body});
  if(r.error){var m=r.error.message;try{var j=await r.error.context.json();if(j&&j.error)m=j.error;}catch(e){}throw new Error(m);}

async function createLogin(){
  var nl=readNewLogin();S.newLogin=nl;
  if(!nl.person)return toast('Pick the classmate first.',true);
  if(!/^[a-z0-9._-]{3,30}$/.test(nl.username))return toast('Username: 3–30 characters, lowercase letters, numbers, . _ - only.',true);
  if(nl.password.length<6)return toast('Starting password needs at least 6 characters.',true);
  var who=personById(Number(nl.person));
  if(!window.confirm('Create login "'+nl.username+'" for '+(who?who.name:'this classmate')+' as '+ROLE[nl.role]+'?'))return;
  S.busy=true;render();
  var res=await callFn({action:'create',person_id:Number(nl.person),role:nl.role,username:nl.username,password:nl.password});
  S.busy=false;
  var lg=await sb.from('app_users').select('user_id,username,role,zone_id,person_id,must_change_password,created_at,title');if(!lg.error)S.logins=lg.data;await loadSecrets();
  S.copy={title:'Login created for '+res.name,text:loginMessage(res.name,nl.username,nl.password)};
  S.newLogin=null;render();
}
async function resetPw(username){
  if(!window.confirm('Give '+username+' a new starting password? Their current password stops working.'))return;
  var pw=genPw();await callFn({action:'reset_password',username:username,password:pw});
  var l=S.logins.find(function(x){return x.username===username;}),p=l?personById(l.person_id):null;
  var lg=await sb.from('app_users').select('user_id,username,role,zone_id,person_id,must_change_password,created_at,title');if(!lg.error)S.logins=lg.data;await loadSecrets();
  S.copy={title:'New password for '+username,text:loginMessage(p?p.name:username,username,pw)};render();
}
async function setRole(username,role){
  var l=S.logins.find(function(x){return x.username===username;});if(!l)return;
  var p=personById(l.person_id),name=p?p.name:username;
  var groupN=l.person_id?S.people.filter(function(x){return x.group_leader_id===l.person_id;}).length:0;
  var msg='Change '+name+' from '+ROLE[l.role]+' to '+ROLE[role]+'?';
  if(role==='group_leader')msg+='\n\nAs Zone coordinator they will only see people placed in their group in the Teams tab'+(groupN?' ('+groupN+' now).':' (none yet).');
  if(role==='zone_leader')msg+='\n\nThey will see everyone in '+(p?p.zone_name:'their zone')+'.';
  if(role==='coordinator')msg+='\n\nThey will see and edit all 159 classmates.';
  if(l.role==='zone_leader')msg+='\n\nThe zone will have no regional coordinator until you set one.';
  if(!window.confirm(msg)){render();return;}
  try{var res=await callFn({action:'set_role',username:username,role:role});}
  catch(e){render();throw e;}
  var lg=await sb.from('app_users').select('user_id,username,role,zone_id,person_id,must_change_password,created_at,title');if(!lg.error)S.logins=lg.data;await loadSecrets();
  await refreshPeople();render();toast(name+' is now '+ROLE[role]);
}
async function removeLogin(username){
  if(!window.confirm('Remove the login "'+username+'"? They can no longer sign in. Their past entries stay in the history.'))return;
  await callFn({action:'remove',username:username});
  var lg=await sb.from('app_users').select('user_id,username,role,zone_id,person_id,must_change_password,created_at,title');if(!lg.error)S.logins=lg.data;await loadSecrets();
  render();toast('Login removed');
}
async function saveSettings(){
  var d=document.getElementById('sd').value.split(',').map(function(x){return x.trim();}).filter(Boolean);
  var v=document.getElementById('sv').value.split(',').map(function(x){return x.trim();}).filter(Boolean);
  var r=await sb.from('settings').update({date_options:d,venue_options:v,updated_at:new Date().toISOString()}).eq('id',1).select().maybeSingle();
  if(r.error)throw r.error;S.settings=r.data;render();toast('Settings saved');
}
async function changeOwnPw(){
  if(!isTreasurer())return toast('Only the treasurer can change passwords.',true);
  var a=document.getElementById('mp1').value,b=document.getElementById('mp2').value;
  if(a.length<6)return toast('Use at least 6 characters.',true);if(a!==b)return toast('The two passwords do not match.',true);
  var r=await sb.auth.updateUser({password:a});if(r.error)throw r.error;await sb.rpc('password_changed');
  document.getElementById('mp1').value='';document.getElementById('mp2').value='';toast('Password changed');
}

/* ---------------- events ---------------- */
document.addEventListener('click',function(ev){var el=ev.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act');
  if(['query','dready','dremark','zone','nlperson','nlzone','setrole','asgq'].indexOf(a)>-1)return;
  if((a==='closebg'||a==='paycancelbg'||a==='personcancelbg'||a==='assigncancelbg'||a==='sheetclosebg')&&ev.target!==el)return;
  if(el.tagName==='A')return;
  ev.preventDefault();act(a,el,ev);});
document.addEventListener('input',function(ev){var el=ev.target,a=el.getAttribute('data-act');
  if(a==='query'){S.query=el.value;var l=document.getElementById('list');if(l)l.innerHTML=membersBody(scopePeople());}
  else if(a==='dremark'&&S.panel){S.panel.draft.remark=el.value;}
  else if(a==='asgq'&&S.assign){S.assign.q=el.value;refreshAssignParts();}});
document.addEventListener('change',function(ev){var el=ev.target,a=el.getAttribute('data-act');
  if(a==='zone'){S.zone=el.value==='all'?'all':Number(el.value);S.group='all';render();}
  else if(a==='setrole'){setRole(el.getAttribute('data-v'),el.value).catch(function(e){toast(errMsg(e),true);});}
  else if(a==='nlzone'){var z=readNewLogin();z.person='';z.username='';S.newLogin=z;render();}
  else if(a==='nlperson'){var nl=readNewLogin(),prevAuto=(S.newLogin&&S.newLogin.autoUser)||'';var p=personById(Number(nl.person));
    var sug=p?(p.name.toLowerCase().replace(/\./g,' ').split(' ').filter(function(x){return x.length>1;})[0]||'').replace(/[^a-z0-9._-]/g,''):'';
    if(!nl.username||nl.username===prevAuto)nl.username=sug;nl.autoUser=sug;S.newLogin=nl;render();}});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.sheet){S.sheet=null;renderLayer();return;}if(ev.key==='Escape'&&S.assign){S.assign=null;renderLayer();return;}if(ev.key==='Enter'&&ev.target&&ev.target.id==='pa'&&S.payDlg){ev.preventDefault();act('addpay',ev.target,ev);return;}if(ev.key==='Escape'&&S.person){var pc=S.person;S.person=null;if(pc.mode==='edit')openPanel(pc.id,pc.draft);else renderLayer();return;}if(ev.key==='Escape'&&S.payDlg){var pd=S.payDlg;S.payDlg=null;openPanel(pd.id,pd.draft);return;}if(ev.key==='Escape'&&(S.panel||S.move||S.confirm||S.copy)){S.panel=null;S.move=null;S.confirm=null;S.copy=null;renderLayer();}});
document.addEventListener('submit',async function(ev){var f=ev.target,k=f.getAttribute('data-form');if(!k)return;ev.preventDefault();
  try{
    if(k==='login'){var u=f.u.value.trim().toLowerCase().replace(/@.*$/,''),pw=f.p.value;S.busy=true;render();
      var r=await sb.auth.signInWithPassword({email:u+'@'+DOMAIN,password:pw});S.busy=false;
      if(r.error){S.view='login';render();return toast('Wrong username or password.',true);}
      S.view='loading';render();await loadAll();}
    else if(k==='setpw'){var a=f.p1.value,b=f.p2.value;if(a.length<6)return toast('Use at least 6 characters.',true);if(a!==b)return toast('The two passwords do not match.',true);
      S.busy=true;render();var r2=await sb.auth.updateUser({password:a});S.busy=false;if(r2.error){render();throw r2.error;}
      var r3=await sb.rpc('password_changed');if(r3.error)throw r3.error;S.me.must_change_password=false;toast('Password saved');S.view='loading';render();await loadAll();}
  }catch(e){S.busy=false;if(S.view==='loading')S.view='login';render();toast(errMsg(e),true);}
});

/* keyboard height: lift pop-ups above the on-screen keyboard where the browser does not resize the page */
(function(){var vv=window.visualViewport;if(!vv)return;function kb(){var k=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));document.documentElement.style.setProperty('--kb',(k>60?k:0)+'px');}
  vv.addEventListener('resize',kb);vv.addEventListener('scroll',kb);kb();})();
/* ---------------- start ---------------- */
(async function(){
  try{var s=await sb.auth.getSession();if(s.data.session){await loadAll();}else{S.view='login';render();}}
  catch(e){S.view='login';render();toast(errMsg(e),true);}
})();
})();
</script>
